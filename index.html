<style>
:root{
  --bg:#fffaf0; --ink:#1e2a4a; --muted:#5a6683; --card:#ffffff; --line:#e7dfcc;
  --green:#7bb52c; --blue:#2d8fdd; --orange:#f08a00; --purple:#8a4fd1; --ok:#1f9d55; --okbg:#e3f6ea; --ko:#d63b3b; --kobg:#fde8e8;
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 10% 0%,#fff3d2 0,transparent 35%),radial-gradient(circle at 100% 20%,#e6f3ff 0,transparent 30%);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5;min-height:100vh}
h1,h2,h3{font-family:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",sans-serif;line-height:1.2;margin:0 0 .5em}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:rgba(255,250,240,.93);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.top img{width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.top .name{font-family:"Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-size:1.05rem}
.top .name small{display:block;font-family:"Trebuchet MS",sans-serif;font-size:.75rem;color:var(--muted)}
.top .crumb{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:14px;padding:10px 18px;font-weight:700;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.small{padding:6px 12px;font-size:.9rem;box-shadow:0 3px 0 var(--ink)}
.btn.primary{background:var(--accent,var(--blue));color:#fff}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:10px 0 26px}
.hero img{width:210px;max-width:46vw;height:auto;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.hero h1{font-size:clamp(1.7rem,4.5vw,2.5rem)}
.hero p{color:var(--muted);margin:.2em 0}
.tips{background:#fff;border:3px dashed var(--line);border-radius:var(--radius);padding:14px 18px;margin:0 0 26px}
.tips ol{margin:.3em 0 0;padding-left:1.3em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.pcard{background:var(--card);border:3px solid var(--ink);border-radius:var(--radius);box-shadow:0 6px 0 var(--ink);padding:0;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .1s}
.pcard:hover{transform:translateY(-3px)}
.pcard .band{background:var(--accent);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.pcard .band .em{font-size:2rem}
.pcard .band b{font-family:"Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-size:1.15rem}
.pcard .body{padding:12px 16px 16px;flex:1;display:flex;flex-direction:column;gap:8px}
.pcard .q{color:var(--muted);font-size:.95rem}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.badge{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px;background:#eef1f7;border:2px solid #d5dbea}
.badge.done{background:var(--okbg);border-color:#a8dfbd;color:#14653a}
.section-title{margin:30px 0 12px;font-size:1.3rem}
.pc-head{background:var(--accent);color:#fff;border:3px solid var(--ink);border-radius:var(--radius);box-shadow:0 6px 0 var(--ink);padding:16px 20px;display:flex;gap:14px;align-items:center;margin-bottom:22px}
.pc-head .em{font-size:2.6rem}
.pc-head h1{margin:0;font-size:clamp(1.3rem,3.6vw,1.9rem)}
.pc-head p{margin:0;opacity:.95}
.menu{display:grid;gap:14px}
.mitem{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--ink);border-radius:var(--radius);padding:14px 18px;text-decoration:none;color:inherit;box-shadow:0 5px 0 var(--ink);transition:transform .1s}
.mitem:hover{transform:translateY(-2px)}
.mitem .ic{font-size:2rem;width:48px;text-align:center}
.mitem .tx{flex:1}
.mitem .tx b{display:block;font-size:1.08rem}
.mitem .tx span{color:var(--muted);font-size:.92rem}
.lesson-card{background:#fff;border:3px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px}
.lesson-card h3{color:var(--accent)}
.retiens{background:#fff8dc;border:3px solid #f2c94c;border-radius:14px;padding:12px 16px;margin:10px 0}
.retiens::before{content:"💡 Je retiens";display:block;font-weight:800;margin-bottom:4px;color:#8a6500}
.lesson-card table,.tbl{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95rem;background:#fff}
.lesson-card th,.lesson-card td,.tbl th,.tbl td{border:2px solid var(--line);padding:6px 8px;text-align:center}
.lesson-card th,.tbl th{background:#f3f6fb}
.tblwrap{overflow-x:auto}
.figrow{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0;justify-content:center}
.fig{text-align:center;font-size:.9rem;color:var(--muted)}
.fig svg{display:block;background:#f7fbff;border:2px solid #cfe3f7;border-radius:12px;width:160px;max-width:42vw;height:auto}
.fig svg.wide{width:320px;max-width:86vw}
.fig b{display:block;color:var(--ink)}
.tag{display:inline-block;background:var(--accent);color:#fff;border-radius:8px;padding:1px 8px;font-size:.82rem;font-weight:700;margin-right:6px}
mark{background:#e5f2ff;padding:0 4px;border-radius:5px;color:inherit;font-weight:700}
/* quiz */
.progress{height:14px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.pmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:12px}
.qcard{background:#fff;border:3px solid var(--ink);border-radius:var(--radius);box-shadow:0 6px 0 var(--ink);padding:20px}
.qtype{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:6px}
.qtext{font-size:1.15rem;font-weight:700;margin:0 0 14px}
.qcontext{background:#f6f8fc;border-left:6px solid var(--accent);padding:8px 12px;border-radius:8px;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:3px solid #cfd6e6;background:#fff;border-radius:14px;padding:12px 14px;font-size:1.02rem;color:var(--ink);transition:background .1s,border-color .1s}
.opt:hover:not(:disabled){border-color:var(--accent);background:#f7fbff}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:#eef1f7;display:grid;place-items:center;font-weight:800;font-size:.9rem}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--ko);background:var(--kobg)}
.opt:disabled{cursor:default}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf .opt{justify-content:center;font-weight:800;font-size:1.1rem}
.inrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.inrow label{font-weight:700}
input[type=text],select{font:inherit;color:var(--ink);padding:10px 12px;border:3px solid #cfd6e6;border-radius:12px;background:#fff;min-width:0}
input[type=text]{width:170px}
input[type=text].short{width:110px}
select{max-width:100%}
input.good,select.good{border-color:var(--ok);background:var(--okbg)}
input.bad,select.bad{border-color:var(--ko);background:var(--kobg)}
.unit{font-weight:700;color:var(--muted)}
.mrow{display:grid;grid-template-columns:1fr minmax(150px,45%);gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .corr{grid-column:1/-1;color:var(--ok);font-size:.9rem;font-weight:700;margin-top:-4px}
@media(max-width:520px){.mrow{grid-template-columns:1fr}}
.actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.fb{margin-top:16px;border-radius:14px;padding:12px 16px;border:3px solid;animation:pop .25s}
.fb.good{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--kobg);border-color:var(--ko)}
.fb.part{background:#fff4dc;border-color:#e6a100}
.fb b.h{display:block;font-size:1.05rem;margin-bottom:2px}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.result{text-align:center}
.result .big{font-size:3.4rem}
.result .score{font-family:"Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-size:2.2rem}
.errs{text-align:left;margin-top:18px}
.err{border:3px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0;background:#fffdfa}
.err .a{color:var(--ok);font-weight:700}
.center{text-align:center}
footer{max-width:980px;margin:0 auto;padding:20px 16px 40px;color:var(--muted);text-align:center;font-size:.9rem}
footer img{width:70px;height:70px;border-radius:50%}
</style>
</head>

let svgId = 0;
function svgTraj(kind){
  const id = 'ar'+(++svgId);
  const defs = `<defs><marker id="${id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6fb8"/></marker></defs>`;
  let body='', start='';
  const st = 'fill="none" stroke="#2d8fdd" stroke-width="4" stroke-linecap="round"';
  if(kind==='line'){ body=`<path d="M18 78 L138 26" ${st} marker-end="url(#${id})"/>`; start='<circle cx="18" cy="78" r="5" fill="#1f9d55"/>'; }
  else if(kind==='hline'){ body=`<path d="M14 52 L140 52" ${st} marker-end="url(#${id})"/>`; start='<circle cx="14" cy="52" r="5" fill="#1f9d55"/>'; }
  else if(kind==='circle'){ body=`<circle cx="80" cy="50" r="36" ${st}/>`; start='<circle cx="80" cy="14" r="5" fill="#1f9d55"/>'; }
  else if(kind==='arc'){ body=`<path d="M24 80 A 66 66 0 0 1 136 80" ${st} marker-end="url(#${id})"/>`; start='<circle cx="24" cy="80" r="5" fill="#1f9d55"/>'; }
  else if(kind==='wave'){ body=`<path d="M12 56 C 28 6, 48 6, 62 50 S 96 96, 112 50 S 136 12, 146 36" ${st} marker-end="url(#${id})"/>`; start='<circle cx="12" cy="56" r="5" fill="#1f9d55"/>'; }
  else if(kind==='spiral'){ let p=''; for(let a=0;a<=4*Math.PI;a+=.2){ const r=5+a*2.5; p+=(p?'L':'M')+(80+r*Math.cos(a)).toFixed(1)+' '+(50+r*Math.sin(a)).toFixed(1)+' '; }
    body=`<path d="${p}" ${st}/>`; start='<circle cx="85" cy="50" r="5" fill="#1f9d55"/>'; }
  return `<svg viewBox="0 0 160 100" role="img" aria-label="trajectoire">${defs}${body}${start}</svg>`;
}
function svgChrono(pos){
  const id='ar'+(++svgId);
  let s=`<svg class="wide" viewBox="0 0 320 78" role="img" aria-label="positions successives"><defs><marker id="${id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5a6683"/></marker></defs>`;
  s+=`<line x1="8" y1="34" x2="312" y2="34" stroke="#5a6683" stroke-width="2" marker-end="url(#${id})"/>`;
  pos.forEach((p,i)=>{ const x=22+p*2.7; s+=`<circle cx="${x}" cy="34" r="8" fill="#f08a00" stroke="#1e2a4a" stroke-width="2"/><line x1="${x}" y1="46" x2="${x}" y2="52" stroke="#5a6683" stroke-width="2"/><text x="${x}" y="68" font-size="12" text-anchor="middle" fill="#1e2a4a">${i} s</text>`; });
  return s+'</svg>';
}

/* ========================= ENREGISTREMENT DES QUESTIONS ========================= */
PARCOURS.forEach(p=>p.series.forEach(s=>s.questions.forEach((q,i)=>{ q.pc=p.code; q.id=`${p.id}-${s.key}-${i+1}`; q.accent=p.color; })));

/* ========================= MOTEUR DE QUESTIONS ========================= */
const app = $('#app');
const LETTERS='ABCDEFGH';
const TYPE_LABEL={qcm:'QCM',vf:'Vrai ou faux ?',text:'Complète',num:'Calcule',nums:'Calcule',match:'Associe'};
let run=null;

function answerText(q){
  switch(q.t){
    case 'qcm': return q.opts[q.a];
    case 'vf': return q.a?'Vrai':'Faux';
    case 'text': return q.show || q.acc[0];
    case 'num': return (q.show || fmt(q.a))+' '+q.unit;
    case 'nums': return q.fields.map(f=>`${f.label} : ${fmt(f.a)} ${f.unit}`).join(' ; ');
    case 'match': return q.pairs.map(p=>`${p[0]} → ${p[1]}`).join(' ; ');
  }
}
const OK_MSG=['Bravo !','Exact !','Bien joué !','Parfait !','Excellent !'];

function renderQuestion(q, host, onDone){
  let finished=false;
  const accent=q.accent||'#2d8fdd';
  const head=`<div class="qtype">${q.runTag?`<span class="tag" style="--accent:${accent}">${q.pc}</span>`:''}${TYPE_LABEL[q.t]}</div><p class="qtext">${q.q}</p>${q.fig||''}`;
  host.innerHTML=head+'<div class="qbody"></div><div class="qfb" aria-live="polite"></div>';
  const body=$('.qbody',host), fbEl=$('.qfb',host);

  const finish=(score,detail)=>{
    if(finished) return; finished=true;
    const cls = score>=1?'good':(score>0?'part':'bad');
    const title = score>=1? OK_MSG[Math.floor(Math.random()*OK_MSG.length)] : (score>0?'Presque !':'Pas tout à fait.');
    const icon = score>=1?'✅':(score>0?'🟡':'❌');
    fbEl.innerHTML=`<div class="fb ${cls}"><b class="h">${icon} ${title}</b>${score>=1?'':`<div><span class="a">Réponse attendue :</span> <b>${answerText(q)}</b></div>`}<div>${q.ex||''}</div></div>`;
    onDone(score);
  };

  if(q.t==='qcm'){
    const items=shuffle(q.opts.map((o,i)=>({o,i})));
    body.innerHTML=`<div class="opts">${items.map((it,k)=>`<button class="opt" data-i="${it.i}"><span class="k">${LETTERS[k]}</span><span>${it.o}</span></button>`).join('')}</div>`;
    body.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      if(finished) return; const i=+b.dataset.i;
      body.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.i===q.a) x.classList.add('good');});
      if(i!==q.a) b.classList.add('bad');
      finish(i===q.a?1:0);
    }));
  }
  else if(q.t==='vf'){
    body.innerHTML=`<div class="vf"><button class="opt" data-v="1">✔ Vrai</button><button class="opt" data-v="0">✘ Faux</button></div>`;
    body.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      if(finished) return; const v=b.dataset.v==='1';
      body.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if((x.dataset.v==='1')===q.a) x.classList.add('good');});
      if(v!==q.a) b.classList.add('bad');
      finish(v===q.a?1:0);
    }));
  }
  else if(q.t==='text'){
    body.innerHTML=`<div class="inrow"><input type="text" aria-label="Ta réponse" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn small primary" style="--accent:${accent}">Vérifier</button></div>`;
    const inp=$('input',body), btn=$('button',body);
    const go=()=>{ if(finished||!inp.value.trim()) return; const ok=q.acc.map(norm).includes(norm(inp.value)); inp.disabled=btn.disabled=true; inp.classList.add(ok?'good':'bad'); finish(ok?1:0); };
    btn.addEventListener('click',go); inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();}); inp.focus({preventScroll:true});
  }
  else if(q.t==='num'){
    body.innerHTML=`<div class="inrow"><input type="text" inputmode="decimal" aria-label="Ta réponse" autocomplete="off"><span class="unit">${q.unit}</span><button class="btn small primary" style="--accent:${accent}">Vérifier</button></div>`;
    const inp=$('input',body), btn=$('button',body);
    const go=()=>{ if(finished||!inp.value.trim()) return; const v=parseNum(inp.value); const ok=!isNaN(v)&&Math.abs(v-q.a)<=(q.tol||0)+1e-9; inp.disabled=btn.disabled=true; inp.classList.add(ok?'good':'bad'); finish(ok?1:0); };
    btn.addEventListener('click',go); inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();}); inp.focus({preventScroll:true});
  }
  else if(q.t==='nums'){
    body.innerHTML=q.fields.map((f,i)=>`<div class="inrow"><label for="f${i}">${f.label}</label><input id="f${i}" class="short" type="text" inputmode="decimal" autocomplete="off"><span class="unit">${f.unit}</span></div>`).join('')+`<div class="actions"><button class="btn small primary" style="--accent:${accent}">Vérifier</button></div>`;
    const inps=[...body.querySelectorAll('input')], btn=$('button',body);
    const go=()=>{ if(finished) return; if(inps.some(i=>!i.value.trim())) return; let ok=0;
      inps.forEach((inp,i)=>{ const v=parseNum(inp.value); const good=!isNaN(v)&&Math.abs(v-q.fields[i].a)<=(q.tol||0)+1e-9; if(good) ok++; inp.classList.add(good?'good':'bad'); inp.disabled=true; });
      btn.disabled=true; finish(ok/q.fields.length); };
    btn.addEventListener('click',go); inps.forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go();})); inps[0].focus({preventScroll:true});
  }
  else if(q.t==='match'){
    const opts=[...new Set(q.pairs.map(p=>p[1]))];
    const sh=shuffle(opts);
    body.innerHTML=q.pairs.map((p,i)=>`<div class="mrow"><div>${p[0]}</div><select data-i="${i}" aria-label="${p[0]}"><option value="">— choisis —</option>${sh.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>`).join('')+`<div class="actions"><button class="btn small primary" style="--accent:${accent}">Vérifier</button></div>`;
    const sels=[...body.querySelectorAll('select')], btn=$('button',body);
    btn.addEventListener('click',()=>{ if(finished) return; if(sels.some(s=>!s.value)){ btn.textContent='Complète toutes les lignes'; setTimeout(()=>btn.textContent='Vérifier',1500); return; }
      let ok=0; sels.forEach((s,i)=>{ const good=s.value===q.pairs[i][1]; if(good) ok++; s.classList.add(good?'good':'bad'); s.disabled=true;
        if(!good){ const c=document.createElement('div'); c.className='corr'; c.textContent='→ '+q.pairs[i][1]; s.closest('.mrow').appendChild(c);} });
      btn.disabled=true; finish(ok/q.pairs.length); });
  }
}

/* ---------- Déroulé d'une série ---------- */
function startRun(set, backHash){
  run={set, i:0, res:[], backHash, qs:set.questions.slice()};
  showQuestion();
}
function showQuestion(){
  const {set,i,qs}=run, q=qs[i], n=qs.length;
  const acc=q.accent||set.color;
  app.style.setProperty('--accent',acc);
  app.innerHTML=`<div class="pmeta"><span><b>${set.title}</b></span><span>Question ${i+1} / ${n}</span></div>
  <div class="progress"><i style="width:${(i/n)*100}%;background:${set.color}"></i></div>
  <div class="qcard"><div id="qhost"></div><div class="actions" id="nav"></div></div>`;
  window.scrollTo({top:0});
  renderQuestion(q,$('#qhost'),score=>{
    run.res[i]={q,score};
    const nav=$('#nav');
    nav.innerHTML=`<button class="btn primary" style="--accent:${set.color}" id="next">${i+1<n?'Question suivante →':'Voir mon bilan 🏁'}</button>`;
    $('#next').focus({preventScroll:true});
    $('#next').addEventListener('click',()=>{ run.i++; run.i<n?showQuestion():showResult(); });
    $('#nav').scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}
function showResult(){
  const {set,res,backHash}=run, n=res.length;
  const total=res.reduce((a,r)=>a+r.score,0), pct=Math.round(total/n*100);
  if(set.key) store.set(set.key,pct);
  const wrong=res.filter(r=>r.score<1);
  const [big,msg]= pct>=90?['🏆','Excellent ! Tu maîtrises cette partie.']: pct>=70?['👍','Bien joué ! Encore un petit effort sur les erreurs.']: pct>=50?['💪','Tu progresses. Relis la leçon puis refais la série.']:['📖','Relis bien la leçon, puis recommence : tu vas y arriver !'];
  app.innerHTML=`<div class="qcard result" style="--accent:${set.color}">
    <div class="big">${big}</div><div class="score">${pct} %</div>
    <p><b>${fmt(Math.round(total*10)/10)} / ${n}</b> — ${msg}</p>
    <div class="actions" style="justify-content:center">
      ${wrong.length?`<button class="btn primary" style="--accent:${set.color}" id="redo-err">Refaire mes ${wrong.length} erreur${wrong.length>1?'s':''}</button>`:''}
      <button class="btn" id="redo">Recommencer la série</button>
      <a class="btn" href="${backHash}">Retour</a>
    </div>
    ${wrong.length?`<div class="errs"><h3>À retravailler</h3>${wrong.map(r=>`<div class="err"><div>${r.q.q}</div><div class="a">Réponse : ${answerText(r.q)}</div><div>${r.q.ex||''}</div></div>`).join('')}</div>`:'<p>Aucune erreur : bravo ! 🎉</p>'}
  </div>`;
  window.scrollTo({top:0});
  $('#redo').addEventListener('click',()=>route());
  const re=$('#redo-err'); if(re) re.addEventListener('click',()=>startRun({title:'Mes erreurs à corriger',color:set.color,questions:shuffle(wrong.map(r=>r.q))},backHash));
}

    return `<a class="pcard" href="#/${p.id}" style="--accent:${p.color}"><div class="band"><span class="em">${p.emoji}</span><b>${p.code} · ${p.title}</b></div>
    <div class="body"><div class="q">${p.question}</div><div>${p.resume}</div>
    <div class="badges"><span class="badge ${done===p.series.length?'done':''}">${done}/${p.series.length} séries à 80 %</span></div></div></a>`; }).join('')}</div>
  <h2 class="section-title">🎯 Pour finir</h2>
  <div class="menu"><a class="mitem" href="#/defi" style="--accent:#1e2a4a"><span class="ic">🏅</span><span class="tx"><b>Défi final : les 4 chapitres mélangés</b><span>20 questions tirées au hasard dans PC2, PC4, PC5 et PC6 — comme à l'évaluation !</span></span>${badge('defi')}</a></div>`;
}
function pageParcours(p){
  setCrumb(`<a class="btn small" href="#/">🏠 Accueil</a>`);
  app.style.setProperty('--accent',p.color);
  app.innerHTML=`<div class="pc-head" style="--accent:${p.color}"><span class="em">${p.emoji}</span><div><h1>${p.code} · ${p.title}</h1><p>${p.question}</p></div></div>
  <div class="menu">
    <a class="mitem" href="#/${p.id}/lecon"><span class="ic">📖</span><span class="tx"><b>1. Relire la leçon</b><span>L'essentiel à retenir, avec des schémas</span></span></a>
    ${p.series.map((s,i)=>`<a class="mitem" href="#/${p.id}/${s.key}"><span class="ic">${s.icon}</span><span class="tx"><b>${i+2}. ${s.title}</b><span>${s.desc} · ${s.questions.length} questions</span></span>${badge(setKey(p,s.key))}</a>`).join('')}
    <a class="mitem" href="#/${p.id}/mini"><span class="ic">🎯</span><span class="tx"><b>${p.series.length+2}. Mini-évaluation</b><span>10 questions au hasard dans tout le parcours</span></span>${badge(setKey(p,'mini'))}</a>
  </div>`;
}
function pageLecon(p){
  setCrumb(`<a class="btn small" href="#/${p.id}">← ${p.code}</a><a class="btn small" href="#/">🏠</a>`);
  app.style.setProperty('--accent',p.color);
  app.innerHTML=`<div class="pc-head" style="--accent:${p.color}"><span class="em">📖</span><div><h1>${p.code} · La leçon</h1><p>${p.question}</p></div></div>${p.lecon}
  <div class="center" style="margin-top:20px"><a class="btn primary" style="--accent:${p.color}" href="#/${p.id}/${p.series[0].key}">Je m'entraîne →</a></div>`;
  window.scrollTo({top:0});
}
function setFor(p,key){
  if(key==='mini'){
    const all=p.series.flatMap(s=>s.questions);
    return {key:setKey(p,'mini'),title:`${p.code} · Mini-évaluation`,color:p.color,questions:sample(all,10)};
  }
  const s=p.series.find(x=>x.key===key); if(!s) return null;
  return {key:setKey(p,key),title:`${p.code} · ${s.title}`,color:p.color,questions:shuffle(s.questions)};
}
function setDefi(){
  const qs=[];
  PARCOURS.forEach(p=>{
    const s1=p.series[0].questions, rest=p.series.slice(1).flatMap(s=>s.questions);
    sample(s1,2).concat(sample(rest,3)).forEach(q=>qs.push({...q,runTag:true}));
  });
  return {key:'defi',title:'Défi final',color:'#1e2a4a',questions:shuffle(qs)};
}

function route(){
  const h=location.hash||'#/'; const parts=h.replace(/^#\/?/,'').split('/').filter(Boolean);
  window.scrollTo({top:0});
  if(!parts.length) return pageHome();
  if(parts[0]==='defi'){ setCrumb('<a class="btn small" href="#/">🏠 Accueil</a>'); return startRun(setDefi(),'#/'); }
  const p=PARCOURS.find(x=>x.id===parts[0]); if(!p) return pageHome();
  if(parts.length===1) return pageParcours(p);
  if(parts[1]==='lecon') return pageLecon(p);
  const set=setFor(p,parts[1]); if(!set) return pageParcours(p);
  setCrumb(`<a class="btn small" href="#/${p.id}">← ${p.code}</a><a class="btn small" href="#/">🏠</a>`);
  startRun(set,`#/${p.id}`);
}
window.addEventListener('hashchange',route);
window.__LDS={PARCOURS,renderQuestion,parseNum,norm};
route();
</script>
</body>
</html>
